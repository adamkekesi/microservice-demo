# One-shot schema migration for the Shipment DB, run before the app rollout (see
# `make migrate`). See inventory-migrate-job.yaml for the rationale.
apiVersion: batch/v1
kind: Job
metadata:
  name: shipment-migrate
  namespace: logistics
  labels:
    app.kubernetes.io/component: migrate
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: Never
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z postgres-shipment 5432; do echo waiting for postgres; sleep 2; done"]
      containers:
        - name: migrate
          image: logistics-shipment:dev
          imagePullPolicy: IfNotPresent
          args: ["migrate"]
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: POSTGRES_PASSWORD
            - name: DATABASE_URL
              value: postgres://logistics:$(POSTGRES_PASSWORD)@postgres-shipment:5432/shipment_db?sslmode=disable
