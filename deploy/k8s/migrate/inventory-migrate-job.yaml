# One-shot schema migration for the Inventory DB, run as a discrete step BEFORE
# the app rollout (see `make migrate`). Decouples DDL from the app deploy: the
# service binary's `migrate` subcommand applies pending migrations and exits, so
# app pods never run DDL (they only verify the schema via EnsureMigrated).
#
# Applied with `kubectl replace --force` (Jobs are immutable), mirroring the k6
# launcher CronJob. Reuses the same image (migrations are baked in at /migrations)
# and the stable `app-secrets` Secret (overlay sets disableNameSuffixHash).
apiVersion: batch/v1
kind: Job
metadata:
  name: inventory-migrate
  namespace: logistics
  labels:
    app.kubernetes.io/component: migrate
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: Never
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z postgres-inventory 5432; do echo waiting for postgres; sleep 2; done"]
      containers:
        - name: migrate
          image: logistics-inventory:dev
          imagePullPolicy: IfNotPresent
          args: ["migrate"]
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: POSTGRES_PASSWORD
            - name: DATABASE_URL
              value: postgres://logistics:$(POSTGRES_PASSWORD)@postgres-inventory:5432/inventory_db?sslmode=disable
