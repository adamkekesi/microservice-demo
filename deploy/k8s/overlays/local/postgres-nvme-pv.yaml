# Local-only storage wiring that pins each Postgres instance to its own folder
# on the ext4 image living on the NVMe (NTFS) disk. For each service the chain is:
#
#   postgres-<svc>-0  ->  PVC data-postgres-<svc>-0  ->  PV postgres-<svc>-nvme
#     ->  node path /mnt/pg-data/<svc>   (via kind extraMounts of /mnt/pg-data)
#       ->  host  /mnt/pg-data/<svc>     (folder on the loop-mounted ext4 image)
#         ->  /mnt/nvme/postgres-data.img  (one file on the NTFS disk)
#
# All three instances share the single ext4 image but write to separate folders.
# A dedicated StorageClass keeps this scoped to Postgres; every other claim keeps
# using kind's default `standard` (local-path) class on the main disk.
#
# Each PV uses claimRef to pre-bind to a specific PVC, so auth/inventory/shipment
# deterministically land in their own folders (otherwise binding to identical
# PVs would be arbitrary). The host folders must exist before the cluster starts:
#   sudo mkdir -p /mnt/pg-data/{auth,inventory,shipment}
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: postgres-local
provisioner: kubernetes.io/no-provisioner
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Retain
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: postgres-auth-nvme
spec:
  capacity:
    storage: 10Gi
  accessModes: ["ReadWriteOnce"]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: postgres-local
  claimRef:
    namespace: logistics
    name: data-postgres-auth-0
  local:
    path: /mnt/pg-data/auth
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - logistics-microservice-control-plane
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: postgres-inventory-nvme
spec:
  capacity:
    storage: 10Gi
  accessModes: ["ReadWriteOnce"]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: postgres-local
  claimRef:
    namespace: logistics
    name: data-postgres-inventory-0
  local:
    path: /mnt/pg-data/inventory
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - logistics-microservice-control-plane
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: postgres-shipment-nvme
spec:
  capacity:
    storage: 10Gi
  accessModes: ["ReadWriteOnce"]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: postgres-local
  claimRef:
    namespace: logistics
    name: data-postgres-shipment-0
  local:
    path: /mnt/pg-data/shipment
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - logistics-microservice-control-plane
