# Local (kind) overlay. This is what `make deploy` applies.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: logistics

resources:
  - ../../base
  # Pins the Postgres volume to an ext4 image on the NVMe disk (local-only).
  - postgres-nvme-pv.yaml

# Route each Postgres instance's volume to the NVMe-backed StorageClass. Each
# binds (via claimRef in postgres-nvme-pv.yaml) to its own folder on the shared
# ext4 image. No PGDATA override needed: each PV points at a clean subdirectory,
# which (unlike the ext4 root) has no lost+found to trip up initdb. Other claims
# are untouched and keep using the default `standard` class.
patches:
  - target:
      kind: StatefulSet
      name: postgres-auth
    patch: |
      - op: add
        path: /spec/volumeClaimTemplates/0/spec/storageClassName
        value: postgres-local
  - target:
      kind: StatefulSet
      name: postgres-inventory
    patch: |
      - op: add
        path: /spec/volumeClaimTemplates/0/spec/storageClassName
        value: postgres-local
  - target:
      kind: StatefulSet
      name: postgres-shipment
    patch: |
      - op: add
        path: /spec/volumeClaimTemplates/0/spec/storageClassName
        value: postgres-local

# Enable Datadog tracing (DD_TRACE_ENABLED=true) on the three services. Base
# stays off-by-default; this is the demo opting in. Deploy the Agent the tracers
# send to with `make datadog-up`.
components:
  - ../../components/datadog
  # app-secrets (POSTGRES_*, ADMIN_*) consumed by Postgres and auth. Shared with
  # the migrate kustomization so `make migrate` can provision the same secret
  # standalone; the stable name lets the migrate Jobs reference it. See the
  # component for details.
  - ../../components/app-secrets

# Pin every service to the locally-built, kind-loaded image (see `make images`).
images:
  - name: logistics-auth
    newTag: dev
  - name: logistics-inventory
    newTag: dev
  - name: logistics-shipment
    newTag: dev
