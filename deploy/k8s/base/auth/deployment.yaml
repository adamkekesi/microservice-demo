apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth
spec:
  # Starts at 1: the first pod generates and persists the RSA signing key into
  # auth_db. Once that key exists, the HPA can safely scale auth up (later pods
  # read the same key). See deploy/k8s/README.md.
  replicas: 1
  selector:
    matchLabels:
      app: auth
  template:
    metadata:
      labels:
        app: auth
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z postgres-auth 5432; do echo waiting for postgres; sleep 2; done"]
      containers:
        - name: auth
          image: logistics-auth:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8001
          env:
            - name: PORT
              value: "8001"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: POSTGRES_PASSWORD
            - name: DATABASE_URL
              value: postgres://logistics:$(POSTGRES_PASSWORD)@postgres-auth:5432/auth_db?sslmode=disable
            - name: JWT_ISSUER
              value: auth-service
            - name: JWT_KEY_ID
              value: auth-key-1
            - name: JWT_TTL_SECONDS
              value: "900"
            - name: ADMIN_EMAIL
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: ADMIN_EMAIL
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: ADMIN_PASSWORD
            - name: LOG_LEVEL
              value: info
            - name: DD_ENV
              value: dev
            - name: DD_SERVICE
              value: auth-service
            - name: DD_VERSION
              value: "1.0.0"
            # Datadog agent runs as a node-local DaemonSet; reach it on the host IP.
            - name: DD_AGENT_HOST
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: DD_TRACE_AGENT_PORT
              value: "8126"
            - name: DD_DOGSTATSD_PORT
              value: "8125"
            # No Datadog agent is deployed by default; disable tracing so the app
            # starts clean. Flip to "true" once you deploy the agent (see README).
            - name: DD_TRACE_ENABLED
              value: "false"
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
