# Environment-agnostic base. The local overlay (overlays/local) sets the
# namespace, the secret values, and the locally-built image tags.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - postgres/auth-db.yaml
  - postgres/inventory-db.yaml
  - postgres/shipment-db.yaml
  - auth/deployment.yaml
  - auth/service.yaml
  - auth/hpa.yaml
  - inventory/deployment.yaml
  - inventory/service.yaml
  - inventory/hpa.yaml
  - shipment/deployment.yaml
  - shipment/service.yaml
  - shipment/hpa.yaml
  - ingress.yaml
