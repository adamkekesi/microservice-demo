apiVersion: apps/v1
kind: Deployment
metadata:
  name: shipment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: shipment
  template:
    metadata:
      labels:
        app: shipment
        # Datadog Unified Service Tagging: makes the Agent stamp this pod's logs
        # (collected via containerCollectAll) and metrics with the same
        # service/env/version as APM, so log↔trace correlation matches by service.
        tags.datadoghq.com/env: dev
        tags.datadoghq.com/service: shipment-service
        tags.datadoghq.com/version: "1.0.0"
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z postgres-shipment 5432; do echo waiting for postgres; sleep 2; done"]
        # Wait until auth is serving JWKS, so the one-shot Prime() at startup
        # succeeds and the /ready probe (which requires a cached key) passes.
        - name: wait-for-auth
          image: busybox:1.36
          command: ["sh", "-c", "until wget -q -O /dev/null http://auth:8001/.well-known/jwks.json; do echo waiting for auth jwks; sleep 2; done"]
      containers:
        - name: shipment
          image: logistics-shipment:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8003
          env:
            - name: PORT
              value: "8003"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: POSTGRES_PASSWORD
            - name: DATABASE_URL
              value: postgres://logistics:$(POSTGRES_PASSWORD)@postgres-shipment:5432/shipment_db?sslmode=disable
            - name: AUTH_JWKS_URL
              value: http://auth:8001/.well-known/jwks.json
            - name: JWT_ISSUER
              value: auth-service
            - name: JWKS_CACHE_TTL_SECONDS
              value: "600"
            - name: INVENTORY_BASE_URL
              value: http://inventory:8002
            - name: INVENTORY_TIMEOUT_MS
              value: "5000"
            - name: LOG_LEVEL
              value: info
            - name: DD_ENV
              value: dev
            - name: DD_SERVICE
              value: shipment-service
            - name: DD_VERSION
              value: "1.0.0"
            - name: DD_AGENT_HOST
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: DD_TRACE_AGENT_PORT
              value: "8126"
            - name: DD_DOGSTATSD_PORT
              value: "8125"
            - name: DD_LOGS_INJECTION
              value: "true"
            - name: DD_TRACE_ENABLED
              value: "false"
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
