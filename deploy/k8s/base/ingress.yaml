# API gateway — exactly three routes, one per service, matching the service name.
# Reachable at http://localhost:8080.
#
#   /auth/...       -> auth        passed through (auth already serves /auth/*)
#   /inventory/...  -> inventory   prefix stripped (/inventory/warehouses -> /warehouses)
#   /shipment/...   -> shipment    prefix stripped (/shipment/shipments  -> /shipments)
#
# Two Ingress objects because auth keeps its prefix while the other two strip it
# (the rewrite-target annotation applies per-Ingress).
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: logistics-auth
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /auth
            pathType: Prefix
            backend:
              service:
                name: auth
                port:
                  number: 8001
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: logistics-rewrite
  annotations:
    # $2 is the path after the /inventory or /shipment prefix.
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/use-regex: "true"
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /inventory(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: inventory
                port:
                  number: 8002
          - path: /shipment(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: shipment
                port:
                  number: 8003
