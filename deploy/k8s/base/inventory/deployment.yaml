apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory
spec:
  # 2 replicas to demonstrate Service load balancing; HPA may scale higher.
  replicas: 2
  selector:
    matchLabels:
      app: inventory
  template:
    metadata:
      labels:
        app: inventory
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z postgres-inventory 5432; do echo waiting for postgres; sleep 2; done"]
        # Wait until auth is serving JWKS, so the one-shot Prime() at startup
        # succeeds and the /ready probe (which requires a cached key) passes.
        - name: wait-for-auth
          image: busybox:1.36
          command: ["sh", "-c", "until wget -q -O /dev/null http://auth:8001/.well-known/jwks.json; do echo waiting for auth jwks; sleep 2; done"]
      containers:
        - name: inventory
          image: logistics-inventory:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8002
          env:
            - name: PORT
              value: "8002"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: POSTGRES_PASSWORD
            - name: DATABASE_URL
              value: postgres://logistics:$(POSTGRES_PASSWORD)@postgres-inventory:5432/inventory_db?sslmode=disable
            - name: AUTH_JWKS_URL
              value: http://auth:8001/.well-known/jwks.json
            - name: JWT_ISSUER
              value: auth-service
            - name: JWKS_CACHE_TTL_SECONDS
              value: "600"
            - name: RESERVATION_TTL_SECONDS
              value: "900"
            - name: LOG_LEVEL
              value: info
            - name: DD_ENV
              value: dev
            - name: DD_SERVICE
              value: inventory-service
            - name: DD_VERSION
              value: "1.0.0"
            - name: DD_AGENT_HOST
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: DD_TRACE_AGENT_PORT
              value: "8126"
            - name: DD_DOGSTATSD_PORT
              value: "8125"
            - name: DD_TRACE_ENABLED
              value: "false"
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            # Returns 200 only once DB is reachable AND JWKS has been fetched
            # from auth; keeps the pod out of rotation until dependencies are up.
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi
