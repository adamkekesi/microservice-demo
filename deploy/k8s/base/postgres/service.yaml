# Headless Service: gives the StatefulSet pod stable DNS at `postgres`. Apps
# connect to host `postgres` on 5432 (same hostname as docker-compose).
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  clusterIP: None
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
