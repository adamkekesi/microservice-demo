# Throwaway smoke test for `make cluster-verify`: a tiny echo server behind an
# Ingress, proving traffic flows host:8080 -> ingress-nginx -> Service -> Pod.
# Applied and then deleted by the verify target; not part of the app.
apiVersion: v1
kind: Namespace
metadata:
  name: ingress-smoke
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: whoami
  namespace: ingress-smoke
spec:
  replicas: 1
  selector:
    matchLabels:
      app: whoami
  template:
    metadata:
      labels:
        app: whoami
    spec:
      containers:
        - name: whoami
          image: traefik/whoami:v1.10.2
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: whoami
  namespace: ingress-smoke
spec:
  selector:
    app: whoami
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: whoami
  namespace: ingress-smoke
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /whoami
            pathType: Prefix
            backend:
              service:
                name: whoami
                port:
                  number: 80
