kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: logistics-microservice
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 8080
        protocol: TCP
      - containerPort: 443
        hostPort: 8443
        protocol: TCP
    # Expose the host's loop-mounted ext4 image (living on the NVMe NTFS disk)
    # inside the node so the Postgres static PV can bind to it. The host path
    # must be mounted BEFORE `kind create cluster` runs. See deploy/k8s/overlays/
    # local/postgres-nvme-pv.yaml and the README for the host-side setup.
    extraMounts:
      - hostPath: /mnt/pg-data
        containerPath: /mnt/pg-data
