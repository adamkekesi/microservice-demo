# Identity for the hourly launcher CronJob: it (re)creates the TestRun custom
# resource each hour. Scoped to the logistics namespace only.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: k6-soak
  namespace: logistics
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: k6-soak-launcher
  namespace: logistics
rules:
  - apiGroups: ["k6.io"]
    resources: ["testruns"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: k6-soak-launcher
  namespace: logistics
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: k6-soak-launcher
subjects:
  - kind: ServiceAccount
    name: k6-soak
    namespace: logistics
