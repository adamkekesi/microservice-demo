# golangci-lint v2 config (pinned via mise). Operates per-module; the Makefile
# `lint` target loops over modules. gosimple is folded into staticcheck in v2.
version: "2"

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
  exclusions:
    rules:
      # Integration tests are build-tagged; allow their helper patterns.
      - path: test/integration/
        linters:
          - errcheck
