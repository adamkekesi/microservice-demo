# Tooling for the logistics monorepo. `mise install` provisions Go + linters on
# a clean machine; `mise run <task>` wraps the Makefile / compose.
# go.work is auto-detected (GOWORK unset), so the workspace resolves the local
# `platform` module — no replace directives needed.

[tools]
go = "1.25"
golangci-lint = "2"

[tasks.tidy]
description = "go mod tidy across modules (workspace-safe)"
run = "make tidy"

[tasks.build]
description = "Build service binaries into ./bin"
run = "make build"

[tasks.test]
description = "Unit tests (fast, no Docker)"
run = "make test"

[tasks.test-integration]
description = "Integration tests (Testcontainers; needs Docker)"
run = "make test-integration"

[tasks.lint]
description = "golangci-lint per module"
run = "make lint"

[tasks.up]
description = "Bring up the full stack (compose; builds images)"
run = "docker compose up --build"

[tasks.down]
description = "Tear down the stack and its volumes"
run = "docker compose down -v"

[tasks.seed]
description = "Seed inventory via the compose Postgres container"
run = "docker compose exec -T postgres psql -U ${POSTGRES_USER:-logistics} -d inventory_db < scripts/seed_inventory.sql"

[tasks.smoke]
description = "Happy-path smoke test against the running compose stack"
run = "scripts/smoke.sh"

[tasks.k6-operator-up]
description = "Install the Grafana k6 operator into the kind cluster (Helm)"
run = "make k6-operator-up"

[tasks.loadtest]
description = "Run a single ad-hoc k6 TestRun via the operator"
run = "make loadtest"

[tasks.loadtest-clean]
description = "Delete the k6 TestRun + script ConfigMap"
run = "make loadtest-clean"

[tasks.soak-up]
description = "Start the continuous diurnal soak (operator + hourly CronJobs + first run)"
run = "make soak-up"

[tasks.soak-status]
description = "Soak snapshot: TestRun / pods / CronJobs / HPAs / DB row counts"
run = "make soak-status"

[tasks.soak-down]
description = "Stop the soak (CronJobs + TestRun + ConfigMaps)"
run = "make soak-down"
